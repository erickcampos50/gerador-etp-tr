<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador de Termo de Referencia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Web local</p>
      <h1>Gerador de Termo de Referencia</h1>
      <p>Preenchimento guiado com notas explicativas, escolhas condicionais e preview ao vivo.</p>
    </div>
    <div class="model-meta" id="model-meta"></div>
  </header>

  <main class="workspace">
    <section class="panel controls" aria-labelledby="controls-title">
      <div class="panel-heading">
        <h2 id="controls-title">Campos guiados</h2>
        <button class="secondary" type="button" id="validate-button">Verificar pendencias</button>
      </div>
      <div id="form-root"></div>
      <div class="validation-box" aria-live="polite">
        <h3>Validacao</h3>
        <ul id="validation-list"></ul>
      </div>
    </section>

    <section class="panel preview" aria-labelledby="preview-title">
      <div class="panel-heading">
        <h2 id="preview-title">Preview do documento</h2>
        <div class="preview-actions">
          <span class="badge">Modo de autoria</span>
          <button class="secondary" type="button" id="edit-preview-button" aria-pressed="false">Editar resultado</button>
          <button type="button" id="export-button">Gerar HTML imprimivel</button>
        </div>
      </div>
      <div class="legend" aria-label="Legenda de autoria">
        <span><mark>Texto preenchido</mark></span>
        <span><span class="unresolved sample">Pendente</span></span>
        <span><span class="fixed sample">Texto fixo</span></span>
      </div>
      <article class="document-preview" id="preview-root"></article>
    </section>
  </main>

  <dialog id="note-dialog" class="note-dialog">
    <form method="dialog">
      <button class="dialog-close" value="close" aria-label="Fechar nota">x</button>
    </form>
    <div id="note-body"></div>
  </dialog>

  <script src="model-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
